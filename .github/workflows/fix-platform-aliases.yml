name: Fix platform aliases
on:
  push:
    paths:
      - '.github/workflows/fix-platform-aliases.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch platform normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/utils/campaigns.js')
          s = p.read_text()
          marker = "const stripAccents = (s) =>\n  String(s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().trim()"
          helper = marker + "\n\n// Canonical platform keys used by dashboard routes. Source sheets may use FB/IG/TT.\nexport function normalizeCampaignPlatform(value) {\n  const s = stripAccents(value)\n  if (!s) return null\n  if (s === 'fb' || s === 'facebook' || s === 'meta' || s === 'meta ads') return 'facebook'\n  if (s === 'ig' || s === 'instagram') return 'instagram'\n  if (s === 'tt' || s === 'tiktok' || s === 'tik tok') return 'tiktok'\n  if (s === 'google' || s === 'google ads' || s === 'googleads') return 'google'\n  return s\n}"
          if 'export function normalizeCampaignPlatform' not in s:
              s = s.replace(marker, helper)
          old = "  if (fallbackPlatform) {\n    const fb = stripAccents(fallbackPlatform)\n    if (fb === 'facebook') return 'facebook'\n    if (fb === 'instagram') return 'instagram'\n    if (fb === 'tiktok') return 'tiktok'\n    if (fb === 'google') return 'google'\n  }\n  return fallbackPlatform || null"
          s = s.replace(old, "  if (fallbackPlatform) return normalizeCampaignPlatform(fallbackPlatform)\n  return null")
          s = s.replace("  return row?.plataforma ? stripAccents(row.plataforma) : null", "  return normalizeCampaignPlatform(row?.plataforma)")
          p.write_text(s)

          p = Path('src/components/sections/SocialSection.jsx')
          s = p.read_text()
          s = s.replace("import { buildCampaignPerformance, getCampaignPlatform, tipoCampanaToBucket, bucketToLabel } from '../../utils/campaigns'", "import { buildCampaignPerformance, getCampaignPlatform, normalizeCampaignPlatform, tipoCampanaToBucket, bucketToLabel } from '../../utils/campaigns'")
          s = s.replace("const normPlat = v => String(v || '').toLowerCase().trim()", "const normPlat = v => normalizeCampaignPlatform(v) || String(v || '').toLowerCase().trim()")
          old = "  const safeCampanas = Array.isArray(campanas) ? campanas : []\n  const safeAllCampanas = Array.isArray(allCampanas) ? allCampanas : []"
          new = "  const safeCampanas = (Array.isArray(campanas) ? campanas : []).map(r => ({ ...r, plataforma: normalizeCampaignPlatform(r.plataforma) || r.plataforma }))\n  const safeAllCampanas = (Array.isArray(allCampanas) ? allCampanas : []).map(r => ({ ...r, plataforma: normalizeCampaignPlatform(r.plataforma) || r.plataforma }))"
          if old not in s:
              raise SystemExit('Expected SocialSection safe campaign block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/campaigns.js src/components/sections/SocialSection.jsx .github/workflows/fix-platform-aliases.yml
          git commit -m "fix: normalize platform aliases in paid media [skip ci]"
          git rm .github/workflows/fix-platform-aliases.yml
          git commit -m "chore: remove temporary platform alias workflow [skip ci]"
          git push